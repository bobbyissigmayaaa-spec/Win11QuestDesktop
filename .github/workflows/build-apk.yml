name: Build Quest Desktop APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from zip
        run: unzip -q Win11QuestDesktop-CloudBuild.zip -d src_unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: src_unpacked/Win11QuestDesktop
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Win11QuestDesktop-debug-apk
          path: src_unpacked/Win11QuestDesktop/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
